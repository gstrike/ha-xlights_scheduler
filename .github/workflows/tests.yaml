name: Regression tests and release package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check --select F custom_components scripts tests
      - run: ruff format --check custom_components scripts tests
      - run: pytest -q
      - run: python scripts/build_package.py
      - run: python scripts/validate_package.py
